<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Browser Window Background Shadow / Container -->
  <g id="browser-window">
    <!-- Top Header Bar (Cyan/Blue) -->
    <path d="M 68 40 C 68 26.7 78.7 16 92 16 L 468 16 C 481.3 16 492 26.7 492 40 L 492 90 L 68 90 Z" fill="#009BCE" />
    
    <!-- Header Control Buttons -->
    <circle cx="100" cy="53" r="11" fill="#ED4B46" />
    <circle cx="132" cy="53" r="11" fill="#F5BC18" />
    <circle cx="164" cy="53" r="11" fill="#2AC940" />

    <!-- Browser Body (Light Gray Canvas) -->
    <path d="M 68 90 L 492 90 L 492 392 C 492 405.3 481.3 416 468 416 L 92 416 C 78.7 416 68 405.3 68 392 Z" fill="#EAECEE" />

    <!-- Horizontal Content Bars inside Browser Body -->
    <rect x="100" y="122" width="360" height="18" rx="9" fill="#B0B5B9" />
    <rect x="100" y="170" width="360" height="18" rx="9" fill="#B0B5B9" />
    <rect x="100" y="218" width="360" height="18" rx="9" fill="#B0B5B9" />
    <rect x="100" y="266" width="360" height="18" rx="9" fill="#B0B5B9" />
    <rect x="100" y="314" width="360" height="18" rx="9" fill="#B0B5B9" />
    <rect x="100" y="362" width="360" height="18" rx="9" fill="#B0B5B9" />
  </g>

  <!-- Magnifying Glass Group -->
  <g id="magnifying-glass">
    <!-- Handle Grip (Red Pill) -->
    <line x1="102" y1="370" x2="32" y2="440" stroke="#EC3F3F" stroke-width="44" stroke-linecap="round" />

    <!-- Handle Neck (Silver / Light Gray Metal Connector) -->
    <line x1="126" y1="346" x2="106" y2="366" stroke="#D0D3D7" stroke-width="22" stroke-linecap="square" />

    <!-- Lens Glass Fill (Sky Blue) -->
    <circle cx="192" cy="280" r="92" fill="#68B2FF" />

    <!-- Lens Outer Rim (Dark Slate Frame) -->
    <circle cx="192" cy="280" r="92" fill="none" stroke="#4A4E5A" stroke-width="32" />
  </g>
</svg>
