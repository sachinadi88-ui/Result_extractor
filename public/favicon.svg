<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="icon-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA384D" />
      <stop offset="35%" stop-color="#F95716" />
      <stop offset="70%" stop-color="#FA8C16" />
      <stop offset="100%" stop-color="#FADB14" />
    </linearGradient>
    <mask id="browser-mask">
      <rect width="512" height="512" fill="white" />
      <!-- Cut out space for magnifying glass circle -->
      <circle cx="295" cy="275" r="105" fill="black" />
    </mask>
  </defs>

  <!-- Browser Window Frame with Mask for Magnifying Glass -->
  <g mask="url(#browser-mask)">
    <!-- Main Window Outer Border -->
    <rect x="24" y="24" width="410" height="340" rx="36" fill="none" stroke="url(#icon-grad)" stroke-width="26" stroke-linejoin="round" />
    
    <!-- Top Header Separator Line -->
    <line x1="24" y1="96" x2="434" y2="96" stroke="url(#icon-grad)" stroke-width="24" stroke-linecap="round" />
    
    <!-- Window Dots -->
    <circle cx="64" cy="60" r="12" fill="url(#icon-grad)" />
    <circle cx="100" cy="60" r="12" fill="url(#icon-grad)" />
    <circle cx="136" cy="60" r="12" fill="url(#icon-grad)" />

    <!-- Top Row Blocks -->
    <rect x="56" y="132" width="200" height="40" rx="12" fill="none" stroke="url(#icon-grad)" stroke-width="20" />
    <rect x="272" y="132" width="70" height="40" rx="12" fill="none" stroke="url(#icon-grad)" stroke-width="20" />

    <!-- Text Lines -->
    <line x1="56" y1="216" x2="210" y2="216" stroke="url(#icon-grad)" stroke-width="22" stroke-linecap="round" />
    <line x1="56" y1="268" x2="190" y2="268" stroke="url(#icon-grad)" stroke-width="22" stroke-linecap="round" />
    <line x1="56" y1="320" x2="170" y2="320" stroke="url(#icon-grad)" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- Magnifying Glass Circle -->
  <circle cx="295" cy="275" r="92" fill="none" stroke="url(#icon-grad)" stroke-width="28" />

  <!-- Magnifying Glass Handle -->
  <path d="M 360 340 L 452 432 C 462 442 462 458 452 468 C 442 478 426 478 416 468 L 324 376 Z" 
        fill="none" 
        stroke="url(#icon-grad)" 
        stroke-width="24" 
        stroke-linejoin="round" 
        stroke-linecap="round" />
</svg>
